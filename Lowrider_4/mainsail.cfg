# Version 1.11 
# add [include mainsail.cfg] to your printer.cfg to include it to 
# your printer.cfg modify x_park, y_park, z_park_delta and extrude value at the 
# macro _TOOLHEAD_PARK_PAUSE_CANCEL if needed use variable_park: False at 
# CANCEL_PRINT to disallow the parking move

[virtual_sdcard] 
path: ~/printer_data/gcodes
#on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print 
rename_existing: CANCEL_PRINT_BASE #variable_park: True 
gcode:
  {action_respond_info("CANCEL_PRINT")}
  ## Move head and retract only if not already in the pause state and park set to 
  ## true
  {% if printer.pause_resume.is_paused|lower == 'false' and park|lower == 
  'true'%}
    _TOOLHEAD_PARK_PAUSE_CANCEL {% endif %}
  #TURN_OFF_HEATERS
  M106 S0 
  {action_respond_info("Calling cancel print base")} 
  CANCEL_PRINT_BASE 

[gcode_macro PAUSE]
description: Pause the actual running print 
rename_existing: PAUSE_BASE 
gcode:
  PAUSE_BASE 
  _TOOLHEAD_PARK_PAUSE_CANCEL 

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE 
gcode:
  ##### read extrude from _TOOLHEAD_PARK_PAUSE_CANCEL macro #####
  #{% set extrude = printer['gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL'].extrude %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
   {% set get_params = ('VELOCITY=' + params.VELOCITY) %}
  {%else %} 
   {% set get_params = "" %} 
  {% endif %}
  ##### end of definitions #####
  RESUME_BASE {get_params} 

[gcode_macro END_PRINT]
#rename_existing: END_PRINT_BASE
gcode: 
  {action_respond_info("END_PRINT")} _TOOLHEAD_PARK_PAUSE_CANCEL
  #Disable Steppers
  M84 X Y

[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: park toolhead used in PAUSE and CANCEL_PRINT
variable_extrude: 1.0 
gcode:
  {action_respond_info("_TOOLHEAD_PARK_PAUSE_CANCEL")}
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_minimum.x|float + 5.0 %} 
  {% set y_park = printer.toolhead.axis_minimum.y|float + 5.0 %} 
  {% set z_park_delta = 2.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %} 
  {% set z_safe = max_z - z_park_delta %}
  #{% set act_z = printer.toolhead.position.z|float %} {% if act_z < (max_z - 
  #z_park_delta) %}
  #  {% set z_safe = z_park_delta %} {% else %} {% set z_safe = max_z - act_z %} 
  #{% endif %}
  ##### end of definitions #####
  {% if "xyz" in printer.toolhead.homed_axes %} 
    {% set x_park = 101.0 %} 
    {% set y_park = 102.0 %} 
    {% set z_safe = 66.0 %} 
    {action_respond_info("Moving axis to safe positions")} 
    G90 
    G1 Z{z_safe} F900 
    G1 X{x_park} Y{y_park} F6000 
    {% if printer.gcode_move.absolute_coordinates|lower == 'false' %} G91 {% endif %}
  {% else %} 
    {action_respond_info("Printer not homed")} 
  {% endif %}
  {action_respond_info("_TOOLHEAD_PARK_PAUSE_CANCEL end")}
