# unload
[gcode_macro AUTO_UNLOAD]  #unload
gcode:
  MODE_PRESS
  #gcode_pause 1.5
  G4 P{UNLOAD_DURATION}  # time out for x ms for unload from extruder to Y
  MODE_RELEASE
  SET_GCODE_VARIABLE MACRO=AUTO_UNLOAD VARIABLE=Unload_Duration VALUE={UNLOAD_DURATION}
  
# load
[gcode_macro AUTO_LOAD]  #load
gcode:
  MODE_PRESS
  #gcode_pause 1.5
  G4 P{LOAD_DURATION}  # time out for x ms for load from y to extruder
  MODE_RELEASE
  SET_GCODE_VARIABLE MACRO=AUTO_LOAD VARIABLE=Load_Duration VALUE={LOAD_DURATION}

