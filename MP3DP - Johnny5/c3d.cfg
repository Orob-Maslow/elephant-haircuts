[gcode_macro CHAMELEON_RESET] # select channel for print mode
gcode:
  #TOOL_SELECT TOOL=0
  RESET_PRESS
  G4 P500  # time out for x ms
  RESET_RELEASE
  
[gcode_macro T1] # select channel for print mode
gcode:
  #TOOL_SELECT TOOL=0
  MODE_PRESS
  G4 P180  # time out for x ms
  MODE_RELEASE

[gcode_macro T2]
gcode:
  #TOOL_SELECT TOOL=1
  MODE_PRESS
  G4 P220  # time out for x ms
  MODE_RELEASE

[gcode_macro T3]
gcode:
  #TOOL_SELECT TOOL=2
  MODE_PRESS
  G4 P285  # time out for x ms
  MODE_RELEASE

[gcode_macro T4]
gcode:
  #TOOL_SELECT TOOL=3
  MODE_PRESS
  G4 P395  # time out for x ms
  MODE_RELEASE
  
[gcode_macro PRELOAD]
gcode:
  MODE_PRESS
  G4 P30
  MODE_RELEASE
  G4 P1000
  MODE_PRESS
  G4 P{DURATION}
  
[gcode_macro CUT]
gcode:
  MODE_PRESS 
  G4 P820
  MODE_RELEASE

