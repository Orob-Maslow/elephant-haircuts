#[include 3dchameleon.cfg]
# this is the button press file

#Need the tool change options and timings for the button presses.

[output_pin c3d_switch]
    #pin: PD14 # FAN4 not PD5 or PD6
    pin: PB8 # chameleon white -> relay -> blue -> octopus
[output_pin c3d_reset]
    pin: PB9 #chameleon green -> relay -> red -> octopus
[output_pin c3d_load]
    pin: PD5 # chameleon yellow -> relay -> green -> octopus
[output_pin c3d_unload]
    pin: PD6 # chameleon blue -> relay -> black -> octopus
    
[gcode_macro MODE_PRESS]  #trigger = mode
description: this sets the mode pin
gcode:
  #set_digital_out pin=PD5 value=0
  SET_PIN PIN=c3d_switch VALUE=1

[gcode_macro LOAD_PRESS]
description: this sets the manual load pin
gcode:
  #set_digital_out pin=PD5 value=0
  SET_PIN PIN=c3d_load VALUE=1

[gcode_macro RESET_PRESS]
description: this sets the reset pin
gcode:
  #set_digital_out pin=PD5 value=0
  SET_PIN PIN=c3d_reset VALUE=1

[gcode_macro UNLOAD_PRESS]
description: this sets the manual unload pin
gcode:
  #set_digital_out pin=PD5 value=0
  SET_PIN PIN=c3d_unload VALUE=1

[gcode_macro MODE_RELEASE]
description: this releases the mode pin
gcode:
  #set_digital_out pin=PD5 value=1
  SET_PIN PIN=c3d_switch VALUE=0
    
[gcode_macro LOAD_RELEASE]
description: this releases the manual load pin
gcode:
  #set_digital_out pin=PD5 value=1
  SET_PIN PIN=c3d_load VALUE=0

[gcode_macro RESET_RELEASE]
description: this releases the reset pin
gcode:
  #set_digital_out pin=PD5 value=1
  SET_PIN PIN=c3d_reset VALUE=0  
  
[gcode_macro UNLOAD_RELEASE]
description: this releases the manual unload pin
gcode:
  #set_digital_out pin=PD5 value=1
  SET_PIN PIN=c3d_unload VALUE=0

[gcode_macro pulse_chameleon]
gcode:
  {% set pulses = params.pulses | default(15) | int %}
  MODE_PRESS
  G4 P{pulses * 50}
  M117 "Pulse Duration" {pulses * 50}
  MODE_RELEASE

[gcode_macro HOME]
gcode:
  MODE_PRESS
  G4 P715
  M117 "HOME 715"
  MODE_RELEASE

[gcode_macro HOME_LOAD]
gcode:
  MODE_PRESS
  G4 P505
  M117 "HOME 505"
  MODE_RELEASE

[gcode_macro UNLOAD_HOME]
gcode:
  MODE_PRESS
  G4 P610
  M117 "HOME 610"
  MODE_RELEASE
  
