###############################################################################################################################################
# MACROS for Start / Stop / Pause
#############################
  
[idle_timeout]

timeout: 10800 # timeout in seconds (10800 = 3 hours)
gcode:

    TURN_OFF_HEATERS
    
    # Turn off bed, extruder, and fan
    M140 S0
    M104 S0
    M106 S0
  
    # Ensure skew compensation turned off
    SET_SKEW CLEAR=1
  
    # Move to safe position
    #G1 X300 Y300 Z390 F7000
    MOVE_SAFE
    # NEVER Disable steppers to avoid bed drop
    #M84

[save_variables]
filename: ~/variables.cfg
#   Required - provide a filename that would be used to save the
#   variables to disk e.g. ~/variables.cfg

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE
  printer.pause_resume.is_paused = TRUE
  _TOOLHEAD_PARK_PAUSE_CANCEL
  
[gcode_macro CLEARPAUSENOW]
description: pause gets stuck and won't resume
gcode:
  CLEAR_PAUSE
  RESUME_BASE
  
[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  # G92 X and Y Here?
  CLEAR_PAUSE
  ##### read extrude from  _TOOLHEAD_PARK_PAUSE_CANCEL  macro #####
  {% set extrude = printer['gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL'].extrude %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  
  RESUME_BASE {get_params}

[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: park toolhead used in PAUSE and CANCEL_PRINT
variable_extrude: 1.0
gcode:
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_minimum.x|float + 5.0 %}
  {% set y_park = printer.toolhead.axis_minimum.y|float + 5.0 %}
  {% set z_park_delta = 2.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - z_park_delta) %}
    {% set z_safe = z_park_delta %}
  {% else %}
    {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E-{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
    {% if printer.gcode_move.absolute_coordinates|lower == 'false' %} G91 {% endif %}
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
  ## Move head and retract only if not already in the pause state and park set to true
  {% if printer.pause_resume.is_paused|lower == 'false' and park|lower == 'true'%}
    _TOOLHEAD_PARK_PAUSE_CANCEL
  {% endif %}
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE
  #SFS_DISABLE

######################################
# Start GCode
######################################
[gcode_macro START_PRINT]
gcode:
      SKEW_OFF
      G90
      # messages for the LCD display
      M117 Starting bed heater at {params.BED_TEMP|default(40)}
      M140 S{params.BED_TEMP|default(40)}
      M117 HOMING
      G28 X Y Z; home all axes
      M117 Z-offset
      G1 Z10 F5000 ; lift nozzle
      M117 Z tilt procedure begin
      Z_TILT_ADJUST ; level the bed
      # this is for mesh checking
      #BED_MESH_PROFILE LOAD=default
      #LOAD_MESH ;load the mesh based on the bed temperature
      # create mesh 5x5
      M117 Starting extruder heat: {params.EXTRUDER_TEMP|default(215)}
      M104 S{params.EXTRUDER_TEMP|default(215)} ;hot end heating;Start Nozzle heat while bed Mesh is running 
      M117 Starting Bed Mesh measurement
      MAKE_MESH
      M117 carriage front left
      G0 X15 Y15 Z10 F5000 ; wait for heat
      
      #Heat nozzle and bed
      M117 Heat Bed
      M190 S{params.BED_TEMP|default(40)}    ;bed heating   should keep going until the M116 wait for heat soak command halts                      
      M117 Heat nozzle
      M109 S{params.EXTRUDER_TEMP|default(215)} ;hot end heating  
      M117 Extruder Ready
      
      #Precondition extruder
      #SFS_ENABLE

      G92 E0              
      G1 Z2.0 F600        
      G1 Z0.2 F600        
      G1 Z2.0 F600
      M117 Prime Line
     
      #Prime line
      PRIME_LINE

      #turn on skew correction
      SKEW_ON
      
      #Turn on smart Filament sensor 
      #SFS_ENABLE
      
      M117 Printing...

######################################
# Skew Correction

[gcode_macro SKEW_ON]
gcode:
   SKEW_PROFILE LOAD=johnny5_skew_profile
  
[gcode_macro SKEW_OFF]
gcode:
  SET_SKEW CLEAR=1
#-------------------------------------

######################################
# Prime line

[gcode_macro PRIME_LINE]
gcode: 
    M117 Prime Line
    G92 E0 ;Reset Extruder
    # move z axis 
    G1 Z3.6 F3000 ;Move Z Axis up
    # move to prime position 
    G1 X0 Y85 Z2 F5000.0 ;Move to start position
    G1 X0 Y200.0 Z0.35 F1500.0 E15 ;Draw the first line
    G1 X3 Y200.0 Z0.35 F5000.0 ;Move to side a little
    G1 X3 Y85 Z0.35 F1500.0 E30 ;Draw the second line
    G92 E0 ;Reset Extruder
    G1 Z4.0 F3000 ;Move Z Axis up
#-------------------------------------

######################################
# End Gcode
######################################
[gcode_macro END_PRINT]
gcode:
    SKEW_OFF  ;what is this???

    #SFS_DISABLE
    # Turn off bed, extruder, and fan
    
    M140 S0 # bed off
    M104 S0 # nozzle off
    M106 S0 # fan off?
    # Move nozzle away from print while retracting
    G91  # move relative to current position
    G1 E-1 # retract
    G1 Z10 F3000 # drop bed by 10mm
    G90  # move to absolue coordinate positions
    M117 Dropping Bed Now
    G1 X265 Y265 Z380 F7000
    G1 E-1 F100
     # NEVER Disable steppers to avoid bed drop
    #M84
    M117 COMPLETE

###############################################################################################################################################
###############################################################################################################################################
# TUNING MACROS
###############################################################################################################################################
###############################################################################################################################################

# Home, get position, throw around toolhead, home again.
# If MCU stepper positions (first line in GET_POSITION) are greater than a full step different (your number of microsteps), then skipping occured.
# We only measure to a full step to accomodate for endstop variance.
# Example: TEST_SPEED SPEED=300 ACCEL=5000 ITERATIONS=10

[gcode_macro TEST_SPEED]
gcode:
	# Speed
	{% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
	# Iterations
	{% set iterations = params.ITERATIONS|default(5)|int %}
	# Acceleration
	{% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
	# Bounding inset for large pattern (helps prevent slamming the toolhead into the sides after small skips, and helps to account for machines with imperfectly set dimensions)
	{% set bound = params.BOUND|default(20)|int %}
	# Size for small pattern box
	{% set smallpatternsize = SMALLPATTERNSIZE|default(20)|int %}
	
	# Large pattern
		# Max positions, inset by BOUND
		{% set x_min = printer.toolhead.axis_minimum.x + bound %}
		{% set x_max = printer.toolhead.axis_maximum.x - bound %}
		{% set y_min = printer.toolhead.axis_minimum.y + bound %}
		{% set y_max = printer.toolhead.axis_maximum.y - bound %}
	
	# Small pattern at center
		# Find X/Y center point
		{% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
		{% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}
		
		# Set small pattern box around center point
		{% set x_center_min = x_center - (smallpatternsize/2) %}
		{% set x_center_max = x_center + (smallpatternsize/2) %}
		{% set y_center_min = y_center - (smallpatternsize/2) %}
		{% set y_center_max = y_center + (smallpatternsize/2) %}

	# Save current gcode state (absolute/relative, etc)
	SAVE_GCODE_STATE NAME=TEST_SPEED
	
	# Output parameters to g-code terminal
	{ action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }
	
	# Home and get position for comparison later:
		G28
		# QGL if not already QGLd (only if QGL section exists in config)
		{% if printer.configfile.settings.quad_gantry_level %}
			{% if printer.quad_gantry_level.applied == False %}
				QUAD_GANTRY_LEVEL
				G28 Z
			{% endif %}
		{% endif %}	
		G90
		G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
		G4 P1000 
		GET_POSITION

	# Go to starting position
	G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}

	# Set new limits
	SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel}

	{% for i in range(iterations) %}
		# Large pattern
			# Diagonals
			G0 X{x_min} Y{y_min} F{speed*60}
			G0 X{x_max} Y{y_max} F{speed*60}
			G0 X{x_min} Y{y_min} F{speed*60}
			G0 X{x_max} Y{y_min} F{speed*60}
			G0 X{x_min} Y{y_max} F{speed*60}
			G0 X{x_max} Y{y_min} F{speed*60}
			
			# Box
			G0 X{x_min} Y{y_min} F{speed*60}
			G0 X{x_min} Y{y_max} F{speed*60}
			G0 X{x_max} Y{y_max} F{speed*60}
			G0 X{x_max} Y{y_min} F{speed*60}
		
		# Small pattern
			# Small diagonals 
			G0 X{x_center_min} Y{y_center_min} F{speed*60}
			G0 X{x_center_max} Y{y_center_max} F{speed*60}
			G0 X{x_center_min} Y{y_center_min} F{speed*60}
			G0 X{x_center_max} Y{y_center_min} F{speed*60}
			G0 X{x_center_min} Y{y_center_max} F{speed*60}
			G0 X{x_center_max} Y{y_center_min} F{speed*60}
			
			# Small box
			G0 X{x_center_min} Y{y_center_min} F{speed*60}
			G0 X{x_center_min} Y{y_center_max} F{speed*60}
			G0 X{x_center_max} Y{y_center_max} F{speed*60}
			G0 X{x_center_max} Y{y_center_min} F{speed*60}
	{% endfor %}

	# Restore max speed/accel to their configured values
	SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} 

	# Re-home and get position again for comparison:
		G28
		# Go to XY home positions (in case your homing override leaves it elsewhere)
		G90
		G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
		G4 P1000 
		GET_POSITION

	# Restore previous gcode state (absolute/relative, etc)
	RESTORE_GCODE_STATE NAME=TEST_SPEED
#----------------------------------------------------------------------------------------------------------------------------------------------
#----------------------------------------------------------------------------------------------------------------------------------------------