# This file is for MP3DP version 5 Serial number 000? home built from plans from V1engineering:
# - Config : {
#   - Usable : { X : 200, Y : 200, Z : 250 },
#   - Controller : BTT SKR 1.2 pro
#     - EndStops : PG6, PG9, PG10, PG11, PG12, PG13, PG14, PG15
#   - Extruder-HotEnd : BIQU H2 V2s LITE Extruder
#     - Thermistor Type : Semitec 104NT-4-R025H42G(NTC100K)
#   - Probe : BTT microtouch Sensor
# 

# Related:
# - See docs/Config_Reference.md for a description of parameters.
# - https://www.klipper3d.org/Config_Reference.html

[include mainsail.cfg]
[include timelapse.cfg]
#[include adxl.cfg]
[include K-ShakeTune/*.cfg]
#[include plasma.cfg]
#[include mpu6050.cfg]
#[include chameleon.cfg]

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT
###############################################################################################################################################
# MCUs
########################################

#[mcu]
[mcu]

restart_method: command  

# basic printer style layout
[printer]
# Related
kinematics: corexy
max_velocity: 600 # default: 300
max_accel: 3500 #AZA default: 3000
max_z_velocity: 300 # default: 5
max_z_accel: 300 # default: 100
square_corner_velocity: 5 # set to default of 5 for input shaping

########################################
# TMC2209 configuration
# - Set uart_pin to CS pin, per pinout diag
########################################

[tmc2209 extruder]
uart_pin: PD6
run_current: 0.8
#hold_current: 0.4
stealthchop_threshold: 0 #999999

[tmc2209 stepper_x]
uart_pin: PC13
#diag_pin: PG6
run_current: 0.9
#hold_current: 0.4
interpolate: False  #AZA Why??? Default True, but gpagnozzi False (note his is Manta M8P not Octopus), see https://www.klipper3d.org/Config_Reference.html?h=pixel#tmc2209 and https://forum.v1e.com/t/mp3dp-v4-build-sw-virginia/37238/31?u=azab2c
stealthchop_threshold: 0 #999999

[tmc2209 stepper_y]
uart_pin: PE3
#diag_pin: PG9
run_current: 0.9 
#hold_current: 0.4
interpolate: False
stealthchop_threshold: 0 # 999999

[tmc2209 stepper_z]
uart_pin: PE1
#diag_pin: PG10
run_current: 0.8
#hold_current: 0.4
interpolate: False
stealthchop_threshold: 0 #999999

[tmc2209 stepper_z1]
uart_pin: PD4
#diag_pin: PG11
run_current: 0.8
#hold_current: 0.4
interpolate: False
stealthchop_threshold: 0 #999999

[tmc2209 stepper_z2]
uart_pin: PD1
#diag_pin: PG12
run_current: 0.8
#hold_current: 0.4
interpolate: False
stealthchop_threshold: 0 #999999

# driver 5 : uart_pin: PE4
# driver 6 : uart_pin: PE1
# driver 7 : PD3

###############################################################################################################################################
# motor definitions
################################################

# Driver0  This is the B motor on the left side

[stepper_x]
enable_pin: !PF2
step_pin: PE9
dir_pin: !PF1
endstop_pin: PB10 ##carriage trigger
microsteps: 16
rotation_distance: 32
position_endstop: -5
position_max: 205
position_min: -5.0
homing_speed: 100
second_homing_speed: 3

# Driver1  this is the A motor on the right side

[stepper_y]
enable_pin: !PD7
step_pin: PE11
dir_pin: !PE8
endstop_pin: PG9 #left motor
microsteps: 16
rotation_distance: 32
position_endstop: 205
position_max: 205
position_min: -5.0
homing_speed: 100
second_homing_speed: 3

## Driver2 for 1 of 3 z motors
#(front left)

[multi_pin z_enable]
pins: !PC0, PD8

[stepper_z]
enable_pin: multi_pin:z_enable
step_pin: PE13
dir_pin: PC2
microsteps: 16
rotation_distance: 32
endstop_pin: probe:z_virtual_endstop
position_max: 400
position_min: -5.0
homing_speed: 50
second_homing_speed: 3
homing_retract_dist: 2

## Driver3 for 2 of 3 z motors
#(rear)

[stepper_z1]
enable_pin: !PC3
step_pin: PE14
dir_pin: !PA0
microsteps: 16
rotation_distance: 32
endstop_pin: probe:z_virtual_endstop

## Driver4 for 3 of 3 z motors
#(front right)

[stepper_z2]
enable_pin: !PA3
step_pin: PD15
dir_pin: PE7
microsteps: 16
rotation_distance: 32
endstop_pin: probe:z_virtual_endstop

#--------------------------------------------------

########################################
# EXTRUDER
########################################

## Driver 5 for extrusion - located on trolley hot end carrier behind part cooling fan

[extruder] # https://www.klipper3d.org/Config_Reference.html#extruder
enable_pin: !PF0
step_pin: PD13
dir_pin: PG9
microsteps: 16
max_extrude_only_distance: 301.0

################################
## CALIBRATE EXTRUSION

# This number was the first used.  the default is 3.433, which would increase the extrusion... maybe less would be better, so the number should increase?
#rotation_distance: 3.484    #3.433 is the number shown online.  if the number increases, this would underextrude
rotation_distance: 3.4335 #.352 was calculated
nozzle_diameter: 0.600
filament_diameter: 1.750

# Related:
# - https://www.klipper3d.org/Config_Reference.html#maxxxxxx-temperature-sensors
## hot end information  
heater_pin: PB1  # HE0
sensor_type: EPCOS 100K B57560G104F #Generic 3950 #ATC Semitec 104NT-4-R025H42G
sensor_pin: PF3 # THermistor #0 connector

# BIQU H2S LITE Spec sheet says "Semitec 104NT-4-R025H42G(NTC100K)"  #Generic 3950 #EPCOS 100K B57560G104F
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 300
min_extrude_temp: 20
pressure_advance: 0.014 ;  Default = pressure_advance = 0

#[gcode_macro M600]
#description: Filament change

################################################
# MACRO to Unload Filament
[gcode_macro Unload]
gcode:
  # check if homed and fake home if necessary
  # if print is paused, save XYZ location and temperature settings
  #G28
  #G1 Z25 F360
  #G1 X165 Y165 F7200
  M109 S220
  G91 ; Set positioning to Relative
  G1 E5 F120
  G1 E-605 F3600  # backs out filament from extruder
  G1 E-50 F360
  G92 E0 ; Reset xtruder
  #G1 X0 Y0 ; Park print head
  #  if print must resume, maintain temperature or shut it off
  M106 S0 ; Turn off part fan
  M104 S0 ; Set nozzle temp to zero
  M140 S0 ; set bed temp to zero
  #M84 X Y E ; Disable X Y and E 

################################################
# MACRO Load Filament
[gcode_macro Load]
gcode:
; Load filament
  #G28
  #G1 Z25 F360
  #G1 X165 Y165 F7200
  M109 S220
  G92 E0
  G91 ; Set positioning to Relative
  G1 E600 F3600
  G1 E50 F360
  G92 E0 ; Reset Extruder
  #G1 X0 Y0 ; Park print head
  M106 S0 ; Turn off part fan
  M104 S0 ; Set nozzle temp to zero
  M140 S0 ; set bed temp to zero
  #M84 X Y E ; Disable X Y and E steppers 
#----------------------------------------------------------------------------------------------------------------------------------------------

###############################################################################################################################################
# Bed Heater
########################################

[heater_bed]
# Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
heater_pin: PD12  # built in board heat 
sensor_pin: PF4 # Thermistor #1   
#max_power: 0.6 #AZA: From Voron...  Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2 .
sensor_type: EPCOS 100K B57560G104F #AZA
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0  #
max_temp: 130 #
#----------------------------------------------------------------------------------------------------------------------------------------------

###################################
# macros for heating bed and hot end

[gcode_macro M109]
rename_existing: M99109
gcode:
    #Parameters
    {% set s = params.S|float %}
    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   ; Wait for hotend temp (within 1 degree)
    {% endif %}

[gcode_macro M190]
rename_existing: M99190
gcode:
    #Parameters,    
    {% set s = params.S|float %}

    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   ; Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s} MAXIMUM={s+1}  ; Wait for bed temp (within 1 degree)
    {% endif %}   
    
###############################################################################################################################################
# Bed Mesh
########################################

# https://www.klipper3d.org/Config_Reference.html?h=pixel#bed-level-support
[bed_mesh]
speed: 150
horizontal_move_z: 8
mesh_min: 40,40  #bed is 295
########################### Measure this ####################
mesh_max: 150,150 # Bed max size minus probe X/Y offset
#############################################################
probe_count: 5,5
algorithm: bicubic #lagrange
mesh_pps: 4, 4 #1, 1
bicubic_tension: .5 #.5
move_check_distance: 5 #10
split_delta_z: .025
fade_start: 1
fade_end: 8
fade_target: 0

[gcode_macro MAKE_MESH]
gcode:
    BED_MESH_PROFILE LOAD=default
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE 
    
############################################
# load bed mesh depending on bed temperature
############################################

[gcode_macro LOAD_MESH]
gcode:
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% if bed_temp >= 75 %}
        BED_MESH_PROFILE LOAD=mesh80
        {% if bed_temp >= 110 %}
            BED_MESH_PROFILE LOAD=mesh110
        {% endif %}
    {% elif bed_temp < 35 %}
            BED_MESH_PROFILE LOAD=mesh20
    {% else %}
        {% if bed_temp >= 35 %}
            BED_MESH_PROFILE LOAD=mesh40
        {% endif %}
    {% endif %} 
    #M140 S1 # bed mesh ON  -->> this is the same as BED_MESH_PROFILE LOAD=

###############################################################################################################################################
# Z Bed Probe #
################################################

[safe_z_home]
home_xy_position: 100, 100 # Change coordinates to the center of your print bed
speed: 150
#z_hop: 10                 # Move up 10mm
#z_hop_speed: 8

#[probe] #IR arduino object sensor
#pin: !PB7 #(for z stop or PB7 for BLtouch pin)
#z_offset: 15

[force_move] 
enable_force_move: true 

[bltouch]
sensor_pin: ^PA2 # BLTouch Probing input signal pin (^ means pullup)
control_pin: PA1 # SERVO pwm output pin for pin movement
x_offset: -5 # measured offset for H2V2S and hot end fan mounted bl touch
y_offset: -20
#z_offset: 3.575  # this is critical for the first layer print!!! 
                  # PLA (3.6 base is too thick, 3.8 was too thin on part except right rear corner...)
                  # PETG too far a bit
speed: 7.5
samples: 2
sample_retract_dist: 8
#stow_on_each_sample: True #AZA False saves time between probes, but risk hitting/damaging Probe.  Only use if confident breakage risk is low...
probe_with_touch_mode: True

###################################################
# Macros for homing / safe moves

[gcode_macro  FAKE_Z]  
# this homes the machine to move it without actually using end stops
gcode:
  SET_KINEMATIC_POSITION Z=0

[gcode_macro MOVE_SAFE]
description: Move to safe Z position so bed doesn't crash on reset.
gcode:
  G0 Z390 F6000
  
